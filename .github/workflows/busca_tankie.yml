name: Buscar Filmes — Tankie.Tube (Fila + Auto-chain)

on:
  workflow_dispatch:
    inputs:
      filmes:
        description: 'Lista avulsa separada por vírgula (adiciona à fila)'
        required: false
        default: ''
      lote:
        description: 'Quantos filmes processar NESTA execução (1-500)'
        type: number
        default: 200
        required: false
      resetar:
        description: '⚠️ Zerar a fila'
        type: boolean
        default: false
      auto_run:
        description: 'Disparar próxima run se sobrar fila'
        type: boolean
        default: false
      estrito_ptbr:
        description: 'Modo estrito (rejeita títulos sem indicador PT)'
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *' # A cada 6 horas

permissions:
  contents: write
  actions: write

concurrency:
  group: busca-filmes-tankie
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Criar script de busca
        run: |
          cat << 'PYEOF' > busca.py
          import os, re, json, time, sys, unicodedata, requests
          from datetime import datetime, timezone
          from difflib import SequenceMatcher
          from html import escape as html_escape

          try:
              sys.stdout.reconfigure(line_buffering=True)
              sys.stderr.reconfigure(line_buffering=True)
          except Exception:
              pass

          _orig_print = print
          def print(*args, **kwargs):
              kwargs.setdefault("flush", True)
              ts = datetime.now().strftime("%H:%M:%S")
              _orig_print(f"[{ts}]", *args, **kwargs)

          MIN_DURACAO    = 40 * 60
          ARQ_ESTADO     = "fila_estado.json"
          ARQ_TITULOS    = "titulos_encontrados.txt"
          ARQ_FILMES_TXT = "filmes.txt"
          INICIO         = time.time()
          LIMITE_SEG     = 5 * 3600

          LOTE          = max(1, min(500, int(os.environ.get("LOTE", "200") or "200")))
          RESETAR       = os.environ.get("RESETAR", "").lower() == "true"
          ESTRITO_PTBR  = os.environ.get("ESTRITO_PTBR", "false").lower() == "true"

          PT_BR_MARKERS = ["dublado","dublagem","dublada","dublados","pt-br","ptbr","pt br","pt/br","portugues","portugues-br","[pt]","dual audio"]
          EN_SUB_MARKERS = ["legendado","legendada","legendados","leg.","[leg]","(leg)","sub ","[sub]","(sub)","subtitled","eng sub","eng subs","english","[en]","(en)","ingles","original"," ov","ov)"]

          PT_INDICATORS = {
              "o","a","os","as","um","uma","de","do","da","dos","das",
              "ao","aos","na","nas","no","nos","em","e","ou",
              "que","por","para","com","se","mas","nao","sua","seu",
              "suas","seus","esta","este","isso","esse","essa","sao",
              "foi","era","tem","vai","sobre","entre","depois","antes",
              "agora","sempre","nunca","muito","pouco","mais","menos",
              "acao","aventura","comedia","drama","terror","suspense",
              "ficcao","cientifica","animacao","infantil","romance",
              "documentario","musical","guerra","crime","misterio",
              "fantasia","policial","epico","biografico",
              "origem","retorno","vinganca","destino","poder","forca",
              "luta","jogo","jogos","cidade","familia","amigo","inimigo",
              "senhor","aneis","rei","rainha","principe","princesa",
              "guerreiro","guerreiros","heroi","herois","vilao","viloes",
              "soldado","capitao","doutor","homem","mulher","menino",
              "menina","crianca","mundo","vida","amor","morte","tempo",
              "noite","dia","estrada","caminho","viagem","sonho",
              "medo","odio","justica","policia","assassino","estrela",
              "lua","sol","oceano","mar","ilha","montanha","floresta",
              "pais","nacao","imperio","reino","trono","espada",
              "magia","bruxa","vampiro","zumbi","robo","passado",
              "presente","futuro","final","inicio","parte","filme",
              "aguas","fogo","terra","ceu","inferno","paraiso",
              "anjo","demonio","fantasma","monstro","vila","inocentes",
              "silencio","clube","trevas","sombra","estrelas",
              "galaxia","guarda","guardoes","piratas","caribe","volta",
              "cavaleiro","pedra","filosofal","camara","secreta",
              "prisioneiro","azkaban","calice","ordem","fenix",
              "enigma","reliquias","ultimato","infinita","era","ultron",
              "aranha","formiga","vespa","pantera","negra","marvel",
              "estranho","guardioes","thor","hulk","viuva","eterno",
              "eternos","shang","chi","lenda","torres","sociedade",
              "duas","vingadores","duna","matrix","avatar","interestelar",
              "django","golpe","mentira","verdade","capita",
          }

          EN_COMMON = {
              "the","of","and","to","in","is","it","you","that","he",
              "was","for","on","are","with","as","his","they","at","be",
              "this","have","from","or","one","had","by","but","not",
              "what","all","were","we","when","your","can","said","there",
              "use","an","each","which","she","do","how","their","if",
              "will","up","other","about","out","many","then","them",
              "these","so","some","her","would","make","like","him","into",
              "time","has","look","two","more","write","go","see","number",
              "no","way","could","people","my","than","first","water","been",
              "call","who","oil","its","now","find","long","down","day",
              "did","get","come","made","may","part","back","after","only",
              "old","new","over","also","just","know","take","night",
              "love","life","war","world","man","woman","boy","girl",
          }

          BLACKLIST = [
              "aula ", "playlist", "gameplay", "walkthrough", "tutorial",
              "unboxing", "podcast", "entrevista", "interview", "trailer",
              "teaser", "audiobook", "audiolivro", "audio livro", "concerto",
              "show completo", "ao vivo em", "cd completo", "dvd completo",
              "compilação", "compilation", "episódio", "episode ", "temporada ",
              "season ", "matchday", "top 5 gol", "top 10 gol", "gols |", "| gols",
              "hurricane", "notícias ao vivo", "live: ", "let's play", "lets play",
              "documentário", "documentario", "documental", "vinheta",
              "globoplay", "globo video", "review", "reaction", "making of",
              "behind the scenes", "top 10", "top 5 ", "resumo", "resenha",
              "opinião", "opiniao", "meditantes", "meditação",
              "fosdem", "conference", "conferencia", "keynote",
              "palestra", "webinar", "coding", "programming", "developer",
              "livestream", "playthrough", "play-through",
          ]

          STOPWORDS = {
              "o","a","os","as","de","da","do","das","dos","e","em","um","uma",
              "para","por","com","ao","à","no","na","nos","nas",
              "the","an","of","in","on","at","to","for","with",
              "parte","part","vol","volume",
          }

          NUMEROS = {
              "1": ["um","one","primeiro","first"],
              "2": ["dois","duas","two","segundo","second"],
              "3": ["tres","three","terceiro","third"],
              "4": ["quatro","four","quarto","fourth"],
              "5": ["cinco","five","quinto","fifth"],
              "6": ["seis","six","sexto","sixth"],
              "7": ["sete","seven","setimo","seventh"],
              "8": ["oito","eight","oitavo","eighth"],
              "9": ["nove","nine","nono","ninth"],
              "10": ["dez","ten","decimo","tenth"],
          }

          ALIASES = {
              "vingadores":["avengers"],"poderoso":["godfather"],
              "chefao":["godfather"],"senhor":["lord"],"aneis":["rings"],
              "aranha":["spider"],"homem":["man"],"mulher":["woman"],
              "maravilha":["wonder"],"guerra":["war"],"estrelas":["stars","wars"],
              "galaxia":["galaxy"],"guarda":["guardian"],"guardoes":["guardians"],
              "mundo":["world"],"piratas":["pirates"],"caribe":["caribbean"],
              "volta":["back"],"futuro":["future"],"origem":["origin","inception"],
              "clube":["club"],"luta":["fight"],"silencio":["silence"],
              "inocentes":["innocents","lambs"],"mortos":["dead"],
              "noite":["night"],"dia":["day"],"trevas":["dark","darkness"],
              "cavaleiro":["knight"],"cidade":["city"],"deus":["god"],
              "rei":["king"],"rainha":["queen"],"amor":["love"],
              "vida":["life"],"morte":["death"],"tempo":["time"],
              "casa":["house"],"familia":["family"],
              "amigo":["friend"],"inimigo":["enemy"],"sonho":["dream"],
              "jogo":["game"],"lobo":["wolf"],"duna":["dune"],
              "interestelar":["interstellar"],"sangue":["blood"],
              "fogo":["fire"],"agua":["water"],"terra":["earth"],
              "ceu":["sky","heaven"],"inferno":["hell"],
              "fantasma":["ghost"],"monstro":["monster"],"heroi":["hero"],
              "pai":["father"],"mae":["mother"],"filho":["son"],
              "filha":["daughter"],"irmao":["brother"],"irma":["sister"],
              "paz":["peace"],"luz":["light"],"sombra":["shadow"],
              "estrada":["road"],"caminho":["path","way"],
              "viagem":["journey"],"aventura":["adventure"],
              "destino":["destiny","fate"],"medo":["fear"],"odio":["hate"],
              "vinganca":["revenge"],"justica":["justice"],"crime":["crime"],
              "policia":["police"],"assassino":["killer","assassin"],
              "estrela":["star"],"lua":["moon"],"sol":["sun"],
              "oceano":["ocean"],"mar":["sea"],"ilha":["island"],
              "montanha":["mountain"],"floresta":["forest"],
              "pais":["country"],"nacao":["nation"],"imperio":["empire"],
              "reino":["kingdom"],"trono":["throne"],"espada":["sword"],
              "magia":["magic"],"bruxa":["witch"],"vampiro":["vampire"],
              "zumbi":["zombie"],"robo":["robot"],
          }

          def normalizar(t):
              t = unicodedata.normalize("NFKD", t).encode("ascii","ignore").decode("ascii")
              return t.lower()

          def similaridade(a, b):
              return SequenceMatcher(None, normalizar(a), normalizar(b)).ratio()

          def eh_ano(w):
              return w.isdigit() and len(w) == 4 and 1900 <= int(w) <= 2099

          def palavras_significativas(texto):
              n = re.sub(r"[^\w\s]", " ", normalizar(texto))
              return [w for w in n.split()
                      if w not in STOPWORDS and not eh_ano(w)
                      and (len(w) >= 4 or w.isdigit())]

          def extrair_ano(query):
              m = re.search(r'\((\d{4})\)|\[(\d{4})\]', query)
              if m:
                  for g in m.groups():
                      if g and 1900 <= int(g) <= 2099:
                          return int(g)
              return None

          def ano_bate(ano_esperado, titulo):
              if ano_esperado is None:
                  return "sem_ano_query"
              anos_titulo = [int(y) for y in re.findall(r'\b(19\d{2}|20\d{2})\b', titulo)]
              if not anos_titulo:
                  return "sem_ano_titulo"
              if any(abs(a - ano_esperado) <= 1 for a in anos_titulo):
                  return "match"
              return "diferente"

          def classificar_audio(titulo):
              tn = normalizar(titulo)
              if any(p in tn for p in EN_SUB_MARKERS): return "en"
              if any(p in tn for p in PT_BR_MARKERS): return "pt"
              if any(c in titulo.lower() for c in "áàâãéêíóôõúüçñ"): return "pt"
              words = set(re.findall(r"[^\W_]+", tn))
              if words & PT_INDICATORS: return "pt"
              if len(words & EN_COMMON) >= 2: return "en"
              if len(words) <= 2: return "pt?"
              return "?"

          def eh_ptbr(titulo):
              audio = classificar_audio(titulo)
              if audio == "pt":     return True, "PT-BR"
              if audio == "en":     return False, "inglês/legendado"
              if audio == "pt?":    return True, "nome próprio"
              if audio == "?":
                  if ESTRITO_PTBR:  return False, "sem marcador PT"
                  return True, "sem marcador (assumido PT)"
              return True, ""

          def comum_prefixo(a, b):
              n = min(len(a), len(b))
              for i in range(n):
                  if a[i] != b[i]:
                      return i
              return n

          def palavra_bate(word, text_words):
              if word in text_words: return True
              if word.isdigit() and word in NUMEROS:
                  if any(n in text_words for n in NUMEROS[word]): return True
              for num, syns in NUMEROS.items():
                  if word in syns and num in text_words: return True
              if word in ALIASES:
                  if any(a in text_words for a in ALIASES[word]): return True
              for en_w, pt_aliases in ALIASES.items():
                  if word in pt_aliases and en_w in text_words: return True
              if len(word) >= 6:
                  for tw in text_words:
                      if len(tw) >= 6:
                          cp = comum_prefixo(word, tw)
                          shorter = min(len(word), len(tw))
                          if cp >= 6 and (cp / shorter) >= 0.7:
                              return True
              return False

          def eh_relevante(query, titulo):
              ano = extrair_ano(query)
              ano_status = ano_bate(ano, titulo)
              if ano_status == "diferente":
                  return False
              if ano_status == "sem_ano_titulo":
                  if similaridade(query, titulo) < 0.6:
                      return False
              q = palavras_significativas(query)
              if q:
                  tn = normalizar(titulo)
                  # ⭐ Correção do underline que quebrava "Duna_ Parte Dois"
                  text_words = set(re.findall(r"[^\W_]+", tn))
                  if not all(palavra_bate(w, text_words) for w in q):
                      return False
              if similaridade(query, titulo) < 0.4:
                  return False
              return True

          def passa_blacklist(titulo):
              tn = normalizar(titulo)
              return not any(n in tn for n in BLACKLIST)

          def formatar_duracao(seg):
              h,m,s = seg//3600,(seg%3600)//60,seg%60
              return f"{h}h{m:02d}m{s:02d}s" if h else f"{m}m{s:02d}s"

          def slugify(t):
              t = unicodedata.normalize("NFKD", t).encode("ascii","ignore").decode("ascii")
              t = re.sub(r"[^\w\s-]", "", t).strip().lower()
              return re.sub(r"[-\s]+", "-", t)[:80] or "video"

          def tempo_esgotado():
              return (time.time() - INICIO) > LIMITE_SEG

          def barra_progresso(atual, total, filme="", sufixo=""):
              pct = int(100 * atual / total) if total else 0
              bloco = pct // 5
              barra = "█" * bloco + "░" * (20 - bloco)
              nome = (filme[:38] + "…") if len(filme) > 38 else filme
              sys.stdout.write(f"\r[{barra}] {pct:3d}% {atual}/{total} {nome:<40} {sufixo}")
              sys.stdout.flush()

          def gerar_html(titulo, thumb, link, outdir):
              os.makedirs(outdir, exist_ok=True)
              filename = os.path.join(outdir, slugify(titulo) + ".html")
              json_ld = {
                  "@context": "https://schema.org", "@type": "VideoObject",
                  "supportPlatform": ["https://schema.org/IOSPlatform","https://schema.org/AndroidPlatform"],
                  "name": titulo, "description": "Assista " + titulo,
                  "thumbnailUrl": [thumb] if thumb else [], "contentUrl": link,
              }
              tpl = """<!DOCTYPE html>
          <html lang="pt-BR"><head><meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <script type="application/ld+json">{jl}</script>
          <title>{t}</title>
          <style>body{{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:20px}}h1{{font-size:24px;text-align:center;margin-bottom:30px}}</style>
          </head><body>
          <h1>{t}</h1>
          <div style="background:#0b0b12;border-radius:20px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.8);margin:25px 0;border:1px solid rgba(255,255,255,.06);">
            <a href="{l}" target="_blank" style="display:block;position:relative;text-decoration:none;">
              <img src="{th}" style="width:100%;display:block;">
              <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.7),transparent);"></div>
              <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;background:linear-gradient(135deg,#7a00ff,#c000ff);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(120,0,255,.6);color:white;font-size:26px;border:2px solid rgba(255,255,255,.2);">▶</div>
              <div style="position:absolute;top:12px;right:12px;background:#ff003c;padding:6px 12px;border-radius:20px;font-size:11px;color:#fff;font-weight:bold;">HD</div>
            </a>
          </div></body></html>"""
              with open(filename, "w", encoding="utf-8") as f:
                  f.write(tpl.format(jl=json.dumps(json_ld, ensure_ascii=False, indent=2),
                                     t=html_escape(titulo), l=html_escape(link), th=html_escape(thumb)))

          def carregar_filmes_txt():
              if not os.path.exists(ARQ_FILMES_TXT): return []
              with open(ARQ_FILMES_TXT, "r", encoding="utf-8") as f:
                  return [l.strip() for l in f if l.strip() and not l.strip().startswith("#")]

          def carregar_estado():
              if os.path.exists(ARQ_ESTADO):
                  try:
                      with open(ARQ_ESTADO, "r", encoding="utf-8") as f:
                          return json.load(f)
                  except Exception: pass
              return {"pendentes": [], "processados": [], "execucoes": 0, "ultima_execucao": None}

          def salvar_estado(estado):
              estado["ultima_execucao"] = datetime.now(timezone.utc).isoformat()
              with open(ARQ_ESTADO, "w", encoding="utf-8") as f:
                  json.dump(estado, f, ensure_ascii=False, indent=2)

          def sincronizar(estado, filmes_txt):
              estado["pendentes"] = [f for f in estado["pendentes"] if f in filmes_txt]
              novos = [f for f in filmes_txt
                       if f not in estado["processados"] and f not in estado["pendentes"]]
              estado["pendentes"].extend(novos)
              return novos

          def buscar_tankietube(query, outdir, encontrados):
              n = 0
              for tentativa in range(3):
                  try:
                      r = requests.get("https://tankie.tube/api/v1/search/videos",
                                       params={"search": query, "count": 10}, timeout=30)
                      r.raise_for_status()
                      videos = r.json().get("data", [])
                      for v in videos:
                          name = v.get("name", "")
                          dur = v.get("duration", 0) or 0
                          if dur < MIN_DURACAO: continue
                          if not passa_blacklist(name): continue
                          if not eh_relevante(query, name): continue
                          pt_ok, motivo = eh_ptbr(name)
                          if not pt_ok: continue
                          link = v.get("url") or f"https://tankie.tube/w/{v.get('shortUUID','')}"
                          tp = v.get("thumbnailPath") or v.get("previewPath") or ""
                          thumb = f"https://tankie.tube{tp}" if tp else ""
                          if name and link:
                              gerar_html(name, thumb, link, outdir)
                              encontrados.add(name); n += 1
                              print(f"      [OK] {name} ({formatar_duracao(dur)}) [{motivo}]")
                      return n
                  except requests.exceptions.Timeout:
                      if tentativa < 2:
                          print(f"      [timeout] tentando novamente ({tentativa+2}/3)...")
                          time.sleep(3)
                      else:
                          print(f"      [ERRO] timeout após 3 tentativas")
                  except Exception as e:
                      print(f"      [ERRO] {e}")
                      break
              return n

          def carregar_titulos():
              if not os.path.exists(ARQ_TITULOS): return set()
              with open(ARQ_TITULOS, "r", encoding="utf-8") as f:
                  return {l.strip() for l in f if l.strip()}

          def salvar_titulos(titulos):
              with open(ARQ_TITULOS, "w", encoding="utf-8") as f:
                  for t in sorted(titulos):
                      f.write(t + "\n")

          def main():
              filmes_txt = carregar_filmes_txt()
              entrada = os.environ.get("FILMES_INPUT", "").strip()
              if entrada:
                  for e in [f.strip() for f in entrada.split(",") if f.strip()]:
                      if e not in filmes_txt: filmes_txt.append(e)

              estado = carregar_estado()
              if RESETAR:
                  print("🔄 RESETANDO fila...")
                  estado = {"pendentes": [], "processados": [], "execucoes": 0, "ultima_execucao": None}

              novos = sincronizar(estado, filmes_txt)
              if novos:
                  print(f"➕ {len(novos)} novo(s) filme(s) adicionado(s) à fila")

              print(f"🎙️ Modo PT-BR: {'ESTRITO' if ESTRITO_PTBR else 'PERMISSIVO'}")

              total_geral = len(estado["processados"]) + len(estado["pendentes"])
              total_proc  = len(estado["processados"])

              if not estado["pendentes"]:
                  print("\n✅ Fila vazia.")
                  salvar_estado(estado)
                  with open("/tmp/faltam.txt","w") as f: f.write("0")
                  return

              lote = estado["pendentes"][:LOTE]
              print(f"\n══════ Fila: {total_proc}/{total_geral} — processando {len(lote)} (lote de {LOTE}) ══════\n")

              encontrados = carregar_titulos()
              gerados_agora = 0
              processados_agora = 0

              for i, filme in enumerate(lote, 1):
                  if tempo_esgotado():
                      print(f"\n⏰ Orçamento de tempo esgotado — parando no filme {i}")
                      break

                  barra_progresso(i, len(lote), filme,
                                  f"[fila: {total_proc + i - 1}/{total_geral}]")
                  print(f"\n[{i}/{len(lote)}] {filme}  (fila: {total_proc + i}/{total_geral})")

                  a = buscar_tankietube(filme, "output", encontrados)
                  print(f"      → Total: {a}")

                  estado["pendentes"].remove(filme)
                  estado["processados"].append(filme)
                  processados_agora += 1
                  gerados_agora += a
                  estado["execucoes"] += 1
                  salvar_estado(estado)
                  salvar_titulos(encontrados)

              total_proc = len(estado["processados"])
              restantes  = len(estado["pendentes"])

              print("\n══════════ RESUMO ══════════")
              print(f"Processados agora: {processados_agora} | Total: {total_proc}/{total_geral} | Restantes: {restantes}")
              print(f"HTMLs gerados: {gerados_agora} | Títulos totais: {len(encontrados)}")
              if restantes > 0:
                  print(f"Próximo lote: {', '.join(estado['pendentes'][:3])}{'...' if restantes>3 else ''}")
              else:
                  print("🎉 Fila concluída!")
              print("════════════════════════════")

              salvar_estado(estado)
              with open("/tmp/faltam.txt","w") as f: f.write(str(restantes))

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Executar busca
        env:
          FILMES_INPUT: ${{ github.event.inputs.filmes }}
          LOTE: ${{ inputs.lote || 200 }}
          RESETAR: ${{ inputs.resetar || 'false' }}
          ESTRITO_PTBR: ${{ inputs.estrito_ptbr || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: python -u busca.py

      - name: Commit e push (com retry e rebase)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          mkdir -p output
          touch titulos_encontrados.txt fila_estado.json
          git add output/ titulos_encontrados.txt fila_estado.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração."; exit 0
          fi
          git commit -m "chore: Tankie — novos filmes [skip ci] run=${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            echo "→ Push tentativa $i..."
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}"; then
              echo "✅ Push OK."; exit 0
            fi
            echo "⚠️  Falhou, aguardando $((i*5))s..."
            sleep $((i*5))
          done
          exit 1

      - name: Disparar próxima run
        if: |
          success() && (
            github.event_name == 'schedule' ||
            inputs.auto_run == true ||
            inputs.auto_run == 'true'
          )
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
          LOTE_IN: ${{ inputs.lote || '200' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "⚠️  PAT_CHAIN não configurado."; exit 0
          fi
          FALTAM=$(cat /tmp/faltam.txt 2>/dev/null || echo 0)
          echo "📊 Faltam: $FALTAM"
          if [ "${FALTAM:-0}" -le 0 ]; then exit 0; fi
          LIMITE_ISO=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENTES=$(gh run list --workflow="busca_tankie.yml" --event workflow_dispatch --limit 100 \
            --json createdAt --jq "[.[] | select(.createdAt > \"$LIMITE_ISO\")] | length" \
            --repo "$REPO" 2>/dev/null || echo 0)
          echo "🔁 Runs na última hora: $RECENTES"
          if [ "${RECENTES:-0}" -ge 60 ]; then exit 0; fi
          sleep 30
          gh workflow run "busca_tankie.yml" --repo "$REPO" --ref "${GITHUB_REF_NAME}" \
            -f auto_run=true -f lote="${LOTE_IN}" -f resetar=false -f filmes="" -f estrito_ptbr=false
          echo "✅ Próxima run disparada."
