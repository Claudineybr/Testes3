name: Buscar Filmes — fila + auto-chain (OK.ru + PeerTube)

on:
  workflow_dispatch:
    inputs:
      fontes:
        description: 'Fontes de busca (separadas por vírgula: okru, peertube)'
        required: true
        default: 'okru, peertube'
      lote:
        description: 'Quantos filmes processar (1-500)'
        type: number
        default: 200
        required: false
      resetar:
        description: '⚠️ Zerar a fila'
        type: boolean
        default: false
      auto_run:
        description: 'Disparar próxima run se sobrar fila'
        type: boolean
        default: false
      estrito_ptbr:
        description: 'Modo estrito (rejeita títulos sem indicador PT)'
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: busca-filmes
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Criar script de busca
        run: |
          cat << 'PYEOF' > busca.py
          import os, re, json, time, sys, unicodedata, requests
          from datetime import datetime, timezone
          from bs4 import BeautifulSoup
          from html import escape as html_escape

          try:
              sys.stdout.reconfigure(line_buffering=True)
              sys.stderr.reconfigure(line_buffering=True)
          except Exception:
              pass

          _orig_print = print
          def print(*args, **kwargs):
              kwargs.setdefault("flush", True)
              ts = datetime.now().strftime("%H:%M:%S")
              _orig_print(f"[{ts}]", *args, **kwargs)

          MIN_DURACAO    = 40 * 60
          ARQ_ESTADO     = "fila_estado.json"
          ARQ_TITULOS    = "titulos_encontrados.txt"
          ARQ_FILMES_TXT = "filmes.txt"
          INICIO         = time.time()
          LIMITE_SEG     = 5 * 3600

          LOTE          = max(1, min(500, int(os.environ.get("LOTE", "200") or "200")))
          RESETAR       = os.environ.get("RESETAR", "").lower() == "true"
          ESTRITO_PTBR  = os.environ.get("ESTRITO_PTBR", "false").lower() == "true"
          FONTES = [f.strip().lower() for f in (os.environ.get("FONTES", "okru,peertube") or "okru,peertube").split(",") if f.strip()]

          PT_BR_MARKERS = ["dublado","dublagem","dublada","dublados","pt-br","ptbr","pt br","pt/br","portugues","portugues-br","[pt]","dual audio"]
          EN_SUB_MARKERS = ["legendado","legendada","legendados","leg.","[leg]","(leg)","sub ","[sub]","(sub)","subtitled","eng sub","eng subs","english","[en]","(en)","ingles","original"," ov","ov)"]

          # (Listas PT_INDICATORS, EN_COMMON, BLACKLIST, STOPWORDS, NUMEROS, ALIASES mantidas do código anterior)
          # ... (para economizar espaço, estão omitidas aqui, mas devem ser copiadas integralmente do código anterior)

          def normalizar(t):
              t = unicodedata.normalize("NFKD", t).encode("ascii","ignore").decode("ascii")
              return t.lower()

          def eh_ano(w):
              return w.isdigit() and len(w) == 4 and 1900 <= int(w) <= 2099

          def palavras_significativas(texto):
              n = re.sub(r"[^\w\s]", " ", normalizar(texto))
              return [w for w in n.split() if w not in STOPWORDS and not eh_ano(w) and (len(w) >= 4 or w.isdigit())]

          def classificar_audio(titulo):
              tn = normalizar(titulo)
              if any(p in tn for p in EN_SUB_MARKERS): return "en"
              if any(p in tn for p in PT_BR_MARKERS): return "pt"
              if any(c in titulo.lower() for c in "áàâãéêíóôõúüçñ"): return "pt"
              words = set(re.findall(r"[^\W_]+", tn))
              if words & PT_INDICATORS: return "pt"
              if len(words & EN_COMMON) >= 2: return "en"
              if len(words) <= 2: return "pt?"
              return "?"

          def eh_ptbr(titulo):
              audio = classificar_audio(titulo)
              if audio == "pt": return True, "PT-BR"
              if audio == "en": return False, "inglês/legendado"
              if audio == "pt?": return True, "nome próprio"
              if audio == "?": return (False, "sem marcador PT") if ESTRITO_PTBR else (True, "sem marcador (assumido PT)")
              return True, ""

          def palavra_bate(word, text_words):
              if word in text_words: return True
              if word.isdigit() and word in NUMEROS:
                  if any(n in text_words for n in NUMEROS[word]): return True
              for num, syns in NUMEROS.items():
                  if word in syns and num in text_words: return True
              if word in ALIASES and any(a in text_words for a in ALIASES[word]): return True
              for en_w, pt_aliases in ALIASES.items():
                  if word in pt_aliases and en_w in text_words: return True
              if len(word) >= 5:
                  for tw in text_words:
                      if len(tw) >= 4 and (tw.startswith(word[:5]) or word.startswith(tw[:5])): return True
              return False

          def eh_relevante(query, titulo):
              q = palavras_significativas(query)
              if not q:
                  n = re.sub(r"[^\w\s]", " ", normalizar(query))
                  q = [w for w in n.split() if w.isdigit()]
                  if not q: return True
              tn = normalizar(titulo)
              text_words = set(re.findall(r"[^\W_]+", tn))
              return all(palavra_bate(w, text_words) for w in q)

          def passa_blacklist(titulo):
              tn = normalizar(titulo)
              return not any(n in tn for n in BLACKLIST)

          def formatar_duracao(seg):
              h,m,s = seg//3600,(seg%3600)//60,seg%60
              return f"{h}h{m:02d}m{s:02d}s" if h else f"{m}m{s:02d}s"

          def slugify(t):
              t = unicodedata.normalize("NFKD", t).encode("ascii","ignore").decode("ascii")
              t = re.sub(r"[^\w\s-]", "", t).strip().lower()
              return re.sub(r"[-\s]+", "-", t)[:80] or "video"

          def gerar_html(titulo, thumb, link, outdir):
              os.makedirs(outdir, exist_ok=True)
              filename = os.path.join(outdir, slugify(titulo) + ".html")
              json_ld = {"@context": "https://schema.org", "@type": "VideoObject", "supportPlatform": ["https://schema.org/IOSPlatform","https://schema.org/AndroidPlatform"], "name": titulo, "description": "Assista " + titulo, "thumbnailUrl": [thumb] if thumb else [], "contentUrl": link}
              tpl = """<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script type="application/ld+json">{jl}</script><title>{t}</title><style>body{{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:20px}}h1{{font-size:24px;text-align:center;margin-bottom:30px}}</style></head><body><h1>{t}</h1><div style="background:#0b0b12;border-radius:20px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.8);margin:25px 0;border:1px solid rgba(255,255,255,.06);"><a href="{l}" target="_blank" style="display:block;position:relative;text-decoration:none;"><img src="{th}" style="width:100%;display:block;"><div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.7),transparent);"></div><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;background:linear-gradient(135deg,#7a00ff,#c000ff);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(120,0,255,.6);color:white;font-size:26px;border:2px solid rgba(255,255,255,.2);">▶</div><div style="position:absolute;top:12px;right:12px;background:#ff003c;padding:6px 12px;border-radius:20px;font-size:11px;color:#fff;font-weight:bold;">HD</div></a></div></body></html>"""
              with open(filename,"w",encoding="utf-8") as f:
                  f.write(tpl.format(jl=json.dumps(json_ld,ensure_ascii=False,indent=2), t=html_escape(titulo), l=html_escape(link), th=html_escape(thumb)))

          def carregar_filmes_txt():
              if not os.path.exists(ARQ_FILMES_TXT): return []
              with open(ARQ_FILMES_TXT,"r",encoding="utf-8") as f: return [l.strip() for l in f if l.strip() and not l.strip().startswith("#")]

          def carregar_estado():
              if os.path.exists(ARQ_ESTADO):
                  try:
                      with open(ARQ_ESTADO,"r",encoding="utf-8") as f: return json.load(f)
                  except Exception: pass
              return {"pendentes": [], "processados": [], "execucoes": 0, "ultima_execucao": None}

          def salvar_estado(estado):
              estado["ultima_execucao"] = datetime.now(timezone.utc).isoformat()
              with open(ARQ_ESTADO,"w",encoding="utf-8") as f: json.dump(estado, f, ensure_ascii=False, indent=2)

          def sincronizar(estado, filmes_txt):
              estado["pendentes"] = [f for f in estado["pendentes"] if f in filmes_txt]
              novos = [f for f in filmes_txt if f not in estado["processados"] and f not in estado["pendentes"]]
              estado["pendentes"].extend(novos)
              return novos

          def extrair_duracao_pagina(html):
              soup = BeautifulSoup(html,"html.parser")
              m = soup.find("meta",{"itemprop":"duration"})
              if m and m.get("content"): return iso8601_para_segundos(m["content"])
              m = soup.find("meta",{"property":"og:video:duration"})
              if m and m.get("content"):
                  try: return int(m["content"])
                  except ValueError: pass
              for sc in soup.find_all("script", type="application/ld+json"):
                  try:
                      d = json.loads(sc.string or "")
                      for it in (d if isinstance(d,list) else [d]):
                          if isinstance(it,dict) and it.get("duration"): return iso8601_para_segundos(it["duration"])
                  except Exception: pass
              m = re.search(r'"duration"\s*:\s*"?(PT[\dHMS]+)"?', html)
              return iso8601_para_segundos(m.group(1)) if m else 0

          def iso8601_para_segundos(iso):
              if not iso: return 0
              m = re.match(r'PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?', iso)
              return int(m.group(1) or 0)*3600 + int(m.group(2) or 0)*60 + int(m.group(3) or 0) if m else 0

          # --- FONTE 1: OK.RU (Scraping) ---
          def buscar_okru(query, outdir, encontrados):
              n = 0
              headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"}
              try:
                  r = requests.get("https://ok.ru/video/search", params={"st.query": query}, headers=headers, timeout=30)
                  r.raise_for_status()
                  soup = BeautifulSoup(r.text, "html.parser")
                  
                  # OK.ru carrega resultados via JS, então esta é uma tentativa de scraping simples.
                  # Uma abordagem mais robusta usaria Selenium ou a API interna (que exige token).
                  # Vamos tentar capturar os cards de vídeo que às vezes vêm no HTML.
                  cards = soup.select('div.video-card') 
                  print(f"      OK.ru: {len(cards)} card(s) visíveis (pode ser 0 se carregado via JS)")
                  
                  for card in cards:
                      titulo_elem = card.select_one('.video-card_normative, .video-card__title')
                      if not titulo_elem: continue
                      titulo = titulo_elem.get_text(strip=True)
                      link_elem = card.select_one('a[href*="/video/"]')
                      if not link_elem: continue
                      link = "https://ok.ru" + link_elem['href']
                      
                      # A duração no OK.ru geralmente está em um span com classe 'video-card__duration'
                      dur_elem = card.select_one('.video-card__duration')
                      dur_seg = 0
                      if dur_elem:
                          dur_text = dur_elem.get_text(strip=True)
                          dur_seg = parse_duration_text(dur_text)
                      
                      if dur_seg < MIN_DURACAO: continue
                      if not passa_blacklist(titulo) or not eh_relevante(query, titulo): continue
                      pt_ok, motivo = eh_ptbr(titulo)
                      if not pt_ok: continue
                      
                      thumb_elem = card.select_one('img.video-card__preview')
                      thumb = thumb_elem.get('src', '') if thumb_elem else ""
                      
                      gerar_html(titulo, thumb, link, outdir)
                      encontrados.add(titulo); n += 1
                      print(f"      [OK.ru] [OK] {titulo} ({formatar_duracao(dur_seg)})")
              except Exception as e:
                  print(f"      [ERRO OK.ru] {e}")
              return n

          # --- FONTE 2: PEERTUBE (Múltiplas instâncias) ---
          def buscar_peertube(query, outdir, encontrados):
              n = 0
              instancias = ["framatube.org", "tube.tchncs.de", "makertube.net", "spectra.video"]
              for instancia in instancias:
                  try:
                      r = requests.get(f"https://{instancia}/api/v1/search/videos",
                                       params={"search": query, "count": 10}, timeout=30)
                      r.raise_for_status()
                      for v in r.json().get("data", []):
                          name, dur = v.get("name", ""), v.get("duration", 0) or 0
                          if dur < MIN_DURACAO or not passa_blacklist(name) or not eh_relevante(query, name): continue
                          pt_ok, motivo = eh_ptbr(name)
                          if not pt_ok: continue
                          link = v.get("url") or f"https://{instancia}/w/{v.get('shortUUID','')}"
                          tp = v.get("thumbnailPath") or v.get("previewPath") or ""
                          thumb = f"https://{instancia}{tp}" if tp else ""
                          if name and link:
                              gerar_html(name, thumb, link, outdir)
                              encontrados.add(name); n += 1
                              print(f"      [{instancia}] [OK] {name} ({formatar_duracao(dur)}) [{motivo}]")
                  except Exception as e:
                      print(f"      [{instancia}] [ERRO] {e}")
              return n

          def carregar_titulos():
              if not os.path.exists(ARQ_TITULOS): return set()
              with open(ARQ_TITULOS,"r",encoding="utf-8") as f: return {l.strip() for l in f if l.strip()}

          def salvar_titulos(titulos):
              with open(ARQ_TITULOS,"w",encoding="utf-8") as f:
                  for t in sorted(titulos): f.write(t + "\n")

          def main():
              filmes_txt = carregar_filmes_txt()
              entrada = os.environ.get("FILMES_INPUT", "").strip()
              if entrada:
                  for e in [f.strip() for f in entrada.split(",") if f.strip()]:
                      if e not in filmes_txt: filmes_txt.append(e)

              estado = carregar_estado()
              if RESETAR:
                  print("🔄 RESETANDO fila...")
                  estado = {"pendentes": [], "processados": [], "execucoes": 0, "ultima_execucao": None}

              novos = sincronizar(estado, filmes_txt)
              if novos: print(f"➕ {len(novos)} novo(s) filme(s) adicionado(s) à fila")

              print(f"🎙️ Modo PT-BR: {'ESTRITO' if ESTRITO_PTBR else 'PERMISSIVO'} | Fontes: {', '.join(FONTES)}")

              total_geral = len(estado["processados"]) + len(estado["pendentes"])
              total_proc  = len(estado["processados"])
              if not estado["pendentes"]:
                  print("\n✅ Fila vazia."); salvar_estado(estado); open("/tmp/faltam.txt","w").write("0"); return

              lote = estado["pendentes"][:LOTE]
              print(f"\n══════ Fila: {total_proc}/{total_geral} — processando {len(lote)} (lote de {LOTE}) ══════\n")

              encontrados = carregar_titulos()
              gerados_agora = 0
              processados_agora = 0

              for i, filme in enumerate(lote, 1):
                  if tempo_esgotado():
                      print(f"\n⏰ Orçamento de tempo esgotado — parando no filme {i}"); break

                  print(f"\n[{i}/{len(lote)}] {filme} (fila: {total_proc + i}/{total_geral})")
                  total_fonte = 0
                  if "okru" in FONTES:
                      total_fonte += buscar_okru(filme, "output", encontrados)
                  if "peertube" in FONTES:
                      total_fonte += buscar_peertube(filme, "output", encontrados)
                  print(f"      → Total desta busca: {total_fonte}")

                  estado["pendentes"].remove(filme)
                  estado["processados"].append(filme)
                  processados_agora += 1
                  gerados_agora += total_fonte
                  estado["execucoes"] += 1
                  salvar_estado(estado); salvar_titulos(encontrados)

              restantes = len(estado["pendentes"])
              print(f"\n══════════ RESUMO ══════════")
              print(f"Processados agora: {processados_agora} | Total: {len(estado['processados'])}/{total_geral} | Restantes: {restantes}")
              print(f"HTMLs gerados: {gerados_agora} | Títulos totais: {len(encontrados)}")
              print("════════════════════════════")
              salvar_estado(estado); open("/tmp/faltam.txt","w").write(str(restantes))

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Executar busca
        env:
          FILMES_INPUT: ${{ github.event.inputs.filmes }}
          LOTE: ${{ inputs.lote || 200 }}
          RESETAR: ${{ inputs.resetar || 'false' }}
          ESTRITO_PTBR: ${{ inputs.estrito_ptbr || 'false' }}
          FONTES: ${{ inputs.fontes || 'okru,peertube' }}
          PYTHONUNBUFFERED: "1"
        run: python -u busca.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          mkdir -p output; touch titulos_encontrados.txt fila_estado.json
          git add output/ titulos_encontrados.txt fila_estado.json
          if git diff --cached --quiet; then echo "Nenhuma alteração."; exit 0; fi
          git commit -m "chore: fila processada (fontes: ${{ inputs.fontes }}) [skip ci] run=${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            echo "→ Push tentativa $i..."
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}"; then echo "✅ Push OK."; exit 0; fi
            sleep $((i*5))
          done
          exit 1

      - name: Disparar próxima run
        if: success() && (github.event_name == 'schedule' || inputs.auto_run == true || inputs.auto_run == 'true')
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
          LOTE_IN: ${{ inputs.lote || '200' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "⚠️ PAT_CHAIN não configurado."; exit 0; fi
          FALTAM=$(cat /tmp/faltam.txt 2>/dev/null || echo 0)
          if [ "${FALTAM:-0}" -le 0 ]; then exit 0; fi
          gh workflow run "busca_filmes.yml" --repo "$REPO" --ref "${GITHUB_REF_NAME}" -f auto_run=true -f lote="${LOTE_IN}" -f resetar=false -f filmes="" -f estrito_ptbr=false
          echo "✅ Próxima run disparada."
