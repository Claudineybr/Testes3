name: Buscar Filmes (Tokyvideo & TankieTube) — com fila

on:
  workflow_dispatch:
    inputs:
      filmes:
        description: 'Lista avulsa separada por vírgula (adiciona à fila)'
        required: false
        default: ''
      lote:
        description: 'Quantos filmes processar nesta execução (1-50)'
        type: number
        default: 25
        required: false
      resetar:
        description: '⚠️ Zerar a fila (recomeçar do zero)'
        type: boolean
        default: false
      auto_run:
        description: 'Disparar próxima run automaticamente se sobrar fila'
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  actions: write     # ⭐ necessário para o gh CLI disparar workflows

concurrency:
  group: busca-filmes
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Criar script de busca
        run: |
          cat << 'PYEOF' > busca.py
          import os, re, json, time, unicodedata, requests
          from datetime import datetime, timezone
          from bs4 import BeautifulSoup
          from html import escape as html_escape

          MIN_DURACAO    = 40 * 60
          ARQ_ESTADO     = "fila_estado.json"
          ARQ_TITULOS    = "titulos_encontrados.txt"
          ARQ_FILMES_TXT = "filmes.txt"
          INICIO         = time.time()
          LIMITE_SEG     = 5 * 3600

          LOTE    = max(1, min(50, int(os.environ.get("LOTE", "25") or "25")))
          RESETAR = os.environ.get("RESETAR", "").lower() == "true"

          BLACKLIST = [
              "aula ", "playlist", "gameplay", "walkthrough", "tutorial",
              "unboxing", "podcast", "entrevista", "interview", "trailer",
              "teaser", "audiobook", "audiolivro", "concerto", "show completo",
              "ao vivo em", "cd completo", "dvd completo", "compilação",
              "compilation", "episódio", "episode ", "temporada ", "season ",
              "matchday", "top 5 gol", "top 10 gol", "gols |", "| gols",
              "hurricane", "notícias ao vivo", "live: ", "let's play", "lets play",
          ]

          STOPWORDS = {
              "o","a","os","as","de","da","do","das","dos","e","em","um","uma",
              "para","por","com","ao","à","no","na","nos","nas",
              "the","an","of","in","on","at","to","for","with",
          }

          def normalizar(t):
              t = unicodedata.normalize("NFKD", t).encode("ascii","ignore").decode("ascii")
              return t.lower()

          def palavras_significativas(texto):
              n = re.sub(r"[^\w\s]", " ", normalizar(texto))
              return [w for w in n.split() if len(w) >= 4 and w not in STOPWORDS]

          def eh_relevante(query, titulo):
              q = palavras_significativas(query)
              if not q: return True
              tn = normalizar(titulo)
              return all(w in tn for w in q)

          def passa_blacklist(titulo):
              tn = normalizar(titulo)
              return not any(n in tn for n in BLACKLIST)

          def eh_duracao(text):
              return bool(re.match(r'^\d{1,2}:\d{2}(:\d{2})?$', text.strip()))

          def parse_duration_text(text):
              m = re.match(r'^(\d{1,2}):(\d{2})(?::(\d{2}))?$', text.strip())
              if not m: return 0
              a,b,c = m.groups()
              return int(a)*3600+int(b)*60+int(c) if c else int(a)*60+int(b)

          def iso8601_para_segundos(iso):
              if not iso: return 0
              m = re.match(r'PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?', iso)
              if not m: return 0
              return int(m.group(1) or 0)*3600 + int(m.group(2) or 0)*60 + int(m.group(3) or 0)

          def formatar_duracao(seg):
              h,m,s = seg//3600,(seg%3600)//60,seg%60
              return f"{h}h{m:02d}m{s:02d}s" if h else f"{m}m{s:02d}s"

          def slugify(t):
              t = unicodedata.normalize("NFKD", t).encode("ascii","ignore").decode("ascii")
              t = re.sub(r"[^\w\s-]", "", t).strip().lower()
              return re.sub(r"[-\s]+", "-", t)[:80] or "video"

          def tempo_esgotado():
              return (time.time() - INICIO) > LIMITE_SEG

          def gerar_html(titulo, thumb, link, outdir):
              os.makedirs(outdir, exist_ok=True)
              filename = os.path.join(outdir, slugify(titulo) + ".html")
              json_ld = {
                  "@context": "https://schema.org", "@type": "VideoObject",
                  "supportPlatform": ["https://schema.org/IOSPlatform","https://schema.org/AndroidPlatform"],
                  "name": titulo, "description": "Assista " + titulo,
                  "thumbnailUrl": [thumb] if thumb else [], "contentUrl": link,
              }
              tpl = """<!DOCTYPE html>
          <html lang="pt-BR"><head><meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <script type="application/ld+json">{jl}</script>
          <title>{t}</title>
          <style>body{{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:20px}}h1{{font-size:24px;text-align:center;margin-bottom:30px}}</style>
          </head><body>
          <h1>{t}</h1>
          <div style="background:#0b0b12;border-radius:20px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.8);margin:25px 0;border:1px solid rgba(255,255,255,.06);">
            <a href="{l}" target="_blank" style="display:block;position:relative;text-decoration:none;">
              <img src="{th}" style="width:100%;display:block;">
              <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.7),transparent);"></div>
              <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;background:linear-gradient(135deg,#7a00ff,#c000ff);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(120,0,255,.6);color:white;font-size:26px;border:2px solid rgba(255,255,255,.2);">▶</div>
              <div style="position:absolute;top:12px;right:12px;background:#ff003c;padding:6px 12px;border-radius:20px;font-size:11px;color:#fff;font-weight:bold;">HD</div>
            </a>
          </div></body></html>"""
              with open(filename,"w",encoding="utf-8") as f:
                  f.write(tpl.format(jl=json.dumps(json_ld,ensure_ascii=False,indent=2),
                                     t=html_escape(titulo), l=html_escape(link), th=html_escape(thumb)))

          def carregar_filmes_txt():
              if not os.path.exists(ARQ_FILMES_TXT): return []
              with open(ARQ_FILMES_TXT,"r",encoding="utf-8") as f:
                  return [l.strip() for l in f if l.strip() and not l.strip().startswith("#")]

          def carregar_estado():
              if os.path.exists(ARQ_ESTADO):
                  try:
                      with open(ARQ_ESTADO,"r",encoding="utf-8") as f:
                          return json.load(f)
                  except Exception:
                      pass
              return {"pendentes": [], "processados": [], "execucoes": 0, "ultima_execucao": None}

          def salvar_estado(estado):
              estado["ultima_execucao"] = datetime.now(timezone.utc).isoformat()
              with open(ARQ_ESTADO,"w",encoding="utf-8") as f:
                  json.dump(estado, f, ensure_ascii=False, indent=2)

          def sincronizar(estado, filmes_txt):
              estado["pendentes"] = [f for f in estado["pendentes"] if f in filmes_txt]
              novos = [f for f in filmes_txt
                       if f not in estado["processados"] and f not in estado["pendentes"]]
              estado["pendentes"].extend(novos)
              return novos

          def extrair_duracao_pagina(html):
              soup = BeautifulSoup(html,"html.parser")
              m = soup.find("meta",{"itemprop":"duration"})
              if m and m.get("content"): return iso8601_para_segundos(m["content"])
              m = soup.find("meta",{"property":"og:video:duration"})
              if m and m.get("content"):
                  try: return int(m["content"])
                  except ValueError: pass
              for sc in soup.find_all("script", type="application/ld+json"):
                  try:
                      d = json.loads(sc.string or "")
                      for it in (d if isinstance(d,list) else [d]):
                          if isinstance(it,dict) and it.get("duration"):
                              return iso8601_para_segundos(it["duration"])
                  except Exception: pass
              for sel in ["span.duration","div.duration",".video-duration",".time-duration"]:
                  el = soup.select_one(sel)
                  if el:
                      d = parse_duration_text(el.get_text(strip=True))
                      if d: return d
              for el in soup.find_all(attrs={"data-duration": True}):
                  try:
                      v = str(el["data-duration"]).strip()
                      return int(v) if v.isdigit() else parse_duration_text(v)
                  except Exception: pass
              m = re.search(r'"duration"\s*:\s*"?(PT[\dHMS]+)"?', html)
              return iso8601_para_segundos(m.group(1)) if m else 0

          def buscar_tankietube(query, outdir, encontrados):
              n = 0
              try:
                  r = requests.get("https://tankie.tube/api/v1/search/videos",
                                   params={"search":query,"count":10}, timeout=20)
                  r.raise_for_status()
                  for v in r.json().get("data",[]):
                      name, dur = v.get("name",""), v.get("duration",0) or 0
                      if dur < MIN_DURACAO: continue
                      if not passa_blacklist(name): continue
                      if not eh_relevante(query, name): continue
                      link = v.get("url") or ("https://tankie.tube/w/"+v.get("shortUUID",""))
                      tp = v.get("thumbnailPath") or v.get("previewPath") or ""
                      thumb = "https://tankie.tube" + tp if tp else ""
                      if name and link:
                          gerar_html(name, thumb, link, outdir)
                          encontrados.add(name); n += 1
                          print(f"    [OK] {name} ({formatar_duracao(dur)})")
              except Exception as e:
                  print(f"    [ERRO Tankie] {e}")
              return n

          def buscar_tokyvideo(query, outdir, encontrados):
              n = 0
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8",
              }
              try:
                  r = requests.get("https://www.tokyvideo.com/search",
                                   params={"q":query}, headers=headers, timeout=20)
                  r.raise_for_status()
                  soup = BeautifulSoup(r.text,"html.parser")
                  vistos, links = set(), []
                  for a in soup.find_all("a", href=True):
                      href = a["href"]
                      if "/video/" not in href: continue
                      if href.startswith("/"): href = "https://www.tokyvideo.com" + href
                      elif not href.startswith("http"): continue
                      if href in vistos: continue
                      vistos.add(href); links.append((a, href))
                  print(f"    {len(links)} link(s) na busca")

                  for i, (a, href) in enumerate(links, 1):
                      if tempo_esgotado():
                          print("    ⏰ tempo esgotado no meio do Tokyvideo"); break
                      dur, titulo = 0, (a.get("title") or "").strip()
                      if not titulo:
                          img = a.find("img")
                          if img: titulo = (img.get("alt") or "").strip()
                      a_text = a.get_text(separator=" ", strip=True)
                      if a_text:
                          if eh_duracao(a_text):
                              dur = parse_duration_text(a_text)
                          else:
                              cleaned = []
                              for p in a_text.split():
                                  d = parse_duration_text(p)
                                  if d>0 and dur==0: dur = d
                                  else: cleaned.append(p)
                              if not titulo: titulo = " ".join(cleaned).strip()
                      if not titulo or eh_duracao(titulo):
                          p = a.find_parent()
                          if p:
                              h = p.find(["h3","h2","h4"])
                              if h: titulo = h.get_text(strip=True)
                      if not titulo or eh_duracao(titulo):
                          titulo = href.rsplit("/",1)[-1].replace("-"," ").title()

                      vsoup = None
                      if dur == 0:
                          try:
                              vr = requests.get(href, headers=headers, timeout=15)
                              dur = extrair_duracao_pagina(vr.text)
                              vsoup = BeautifulSoup(vr.text,"html.parser")
                          except Exception: pass
                      if dur == 0 or dur < MIN_DURACAO: continue
                      if not passa_blacklist(titulo): continue
                      if not eh_relevante(query, titulo): continue

                      thumb = ""
                      img = a.find("img")
                      if img:
                          thumb = img.get("src") or img.get("data-src") or img.get("data-lazy-src") or ""
                          if thumb.startswith("//"): thumb = "https:" + thumb
                          elif thumb.startswith("/"): thumb = "https://www.tokyvideo.com" + thumb
                      if not thumb and vsoup:
                          og = vsoup.find("meta", property="og:image")
                          if og: thumb = og.get("content","")
                      gerar_html(titulo, thumb, href, outdir)
                      encontrados.add(titulo); n += 1
                      print(f"    [{i}/{len(links)}] [OK] {titulo} ({formatar_duracao(dur)})")
              except Exception as e:
                  print(f"    [ERRO Toky] {e}")
              return n

          def carregar_titulos():
              if not os.path.exists(ARQ_TITULOS): return set()
              with open(ARQ_TITULOS,"r",encoding="utf-8") as f:
                  return {l.strip() for l in f if l.strip()}

          def salvar_titulos(titulos):
              with open(ARQ_TITULOS,"w",encoding="utf-8") as f:
                  for t in sorted(titulos):
                      f.write(t + "\n")

          def main():
              filmes_txt = carregar_filmes_txt()
              entrada = os.environ.get("FILMES_INPUT", "").strip()
              if entrada:
                  extras = [f.strip() for f in entrada.split(",") if f.strip()]
                  for e in extras:
                      if e not in filmes_txt:
                          filmes_txt.append(e)

              estado = carregar_estado()
              if RESETAR:
                  print("🔄 RESETANDO fila...")
                  estado = {"pendentes": [], "processados": [], "execucoes": 0, "ultima_execucao": None}

              novos = sincronizar(estado, filmes_txt)
              if novos:
                  print(f"➕ {len(novos)} novo(s) filme(s) adicionado(s) à fila")

              total_geral  = len(estado["processados"]) + len(estado["pendentes"])
              total_proc   = len(estado["processados"])

              if not estado["pendentes"]:
                  print("\n✅ Fila vazia — nada a processar.")
                  print(f"   Total processados: {total_proc}/{total_geral}")
                  salvar_estado(estado)
                  with open("/tmp/faltam.txt","w") as f: f.write("0")
                  return

              lote = estado["pendentes"][:LOTE]
              print(f"\n══════ Fila: {total_proc}/{total_geral} processados — "
                    f"processando {len(lote)} agora (lote de {LOTE}) ══════\n")

              encontrados = carregar_titulos()
              gerados_agora = 0
              processados_agora = 0

              for i, filme in enumerate(lote, 1):
                  if tempo_esgotado():
                      print(f"\n⏰ Orçamento de tempo esgotado — parando no filme {i}")
                      break
                  print(f"[{i}/{len(lote)}] {filme}  (progresso: {total_proc + i}/{total_geral})")
                  a = buscar_tankietube(filme, "output", encontrados)
                  b = buscar_tokyvideo(filme, "output", encontrados)
                  print(f"    Tankie: {a} | Toky: {b}\n")

                  estado["pendentes"].remove(filme)
                  estado["processados"].append(filme)
                  processados_agora += 1
                  gerados_agora += a + b
                  estado["execucoes"] += 1
                  salvar_estado(estado)
                  salvar_titulos(encontrados)

              total_proc = len(estado["processados"])
              restantes  = len(estado["pendentes"])

              print("══════════ RESUMO ══════════")
              print(f"Processados nesta execução : {processados_agora}")
              print(f"Total processados até agora: {total_proc}/{total_geral}")
              print(f"Restantes na fila          : {restantes}")
              print(f"HTMLs gerados agora        : {gerados_agora}")
              print(f"Títulos totais (>40min)    : {len(encontrados)}")
              if restantes > 0:
                  prox = estado['pendentes'][:3]
                  print(f"Próximo lote começará por   : {', '.join(prox)}{'...' if restantes>3 else ''}")
              else:
                  print("🎉 Fila concluída!")
              print("════════════════════════════")

              salvar_estado(estado)

              # ⭐ grava contagem para o step de auto-chain
              with open("/tmp/faltam.txt","w") as f:
                  f.write(str(restantes))

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Executar busca
        env:
          FILMES_INPUT: ${{ github.event.inputs.filmes }}
          LOTE: ${{ inputs.lote || 25 }}
          RESETAR: ${{ inputs.resetar || 'false' }}
        run: python busca.py

      - name: Commit e push (com retry e rebase)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true

          mkdir -p output
          touch titulos_encontrados.txt fila_estado.json
          git add output/ titulos_encontrados.txt fila_estado.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi

          git commit -m "chore: fila de filmes — lote processado [skip ci] run=${{ github.run_id }}"

          for i in 1 2 3 4 5; do
            echo "→ Tentativa $i de push..."
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}"; then
              echo "✅ Push OK na tentativa $i."
              exit 0
            fi
            echo "⚠️  Falhou, aguardando $((i*5))s..."
            sleep $((i*5))
          done
          echo "❌ Push falhou após 5 tentativas."
          exit 1

      # ⭐ NOVO: dispara a próxima run se sobrar fila
      - name: Disparar próxima run (se fila não vazia)
        if: |
          success() && (
            github.event_name == 'schedule' ||
            inputs.auto_run == true ||
            inputs.auto_run == 'true'
          )
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
          LOTE_IN: ${{ inputs.lote || '25' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "⚠️  PAT_CHAIN não configurado: sem auto-chain."
            echo "   Crie em Settings → Secrets → Actions (PAT clássico com escopo 'workflow')."
            exit 0
          fi

          FALTAM=$(cat /tmp/faltam.txt 2>/dev/null || echo 0)
          echo "📊 Faltam na fila: $FALTAM"
          if [ "${FALTAM:-0}" -le 0 ]; then
            echo "✅ Fila concluída — não vou disparar mais nada."
            exit 0
          fi

          # Anti-loop: no máximo 60 encadeamentos na última hora
          LIMITE_ISO=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENTES=$(gh run list --workflow="busca_filmes.yml" --event workflow_dispatch --limit 100 \
            --json createdAt --jq "[.[] | select(.createdAt > \"$LIMITE_ISO\")] | length" \
            --repo "$REPO" 2>/dev/null || echo 0)
          echo "🔁 Encadeamentos na última hora: $RECENTES"
          if [ "${RECENTES:-0}" -ge 60 ]; then
            echo "🛑 Limite de 60 runs/hora atingido — parando auto-chain."
            exit 0
          fi

          echo "🚀 Disparando próxima run (lote=$LOTE_IN)..."
          sleep 30
          gh workflow run "busca_filmes.yml" --repo "$REPO" --ref "${GITHUB_REF_NAME}" \
            -f auto_run=true \
            -f lote="${LOTE_IN}" \
            -f resetar=false \
            -f filmes=""
          echo "✅ Próxima run disparada."
