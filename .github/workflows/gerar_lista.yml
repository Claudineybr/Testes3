name: Gerar filmes.txt via TMDB (Máximo)

on:
  workflow_dispatch:
    inputs:
      ano_min:
        description: 'Ano mínimo (1900 para pegar tudo)'
        type: number
        default: 1900
        required: false
      ano_max:
        description: 'Ano máximo'
        type: number
        default: 2026
        required: false
  schedule:
    - cron: '0 0 * * *'   # Todo dia à meia-noite (UTC)

permissions:
  contents: write

concurrency:
  group: gerar-lista-tmdb
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # Aumentei o timeout por segurança
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests

      - name: Gerar lista via TMDB (3 categorias - Máximo)
        env:
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
          ANO_MIN: ${{ inputs.ano_min || '1900' }}
          ANO_MAX: ${{ inputs.ano_max || '2026' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u - <<'PYEOF'
          import os, sys, time, requests
          from datetime import datetime

          try:
              sys.stdout.reconfigure(line_buffering=True)
          except Exception:
              pass

          _orig_print = print
          def print(*args, **kwargs):
              kwargs.setdefault("flush", True)
              ts = datetime.now().strftime("%H:%M:%S")
              _orig_print(f"[{ts}]", *args, **kwargs)

          KEY = os.environ["TMDB_KEY"]
          ANO_MIN = os.environ.get("ANO_MIN") or "1900"
          ANO_MAX = os.environ.get("ANO_MAX") or "2026"
          LANG = "pt-BR"

          # As 3 categorias que serão buscadas
          CATEGORIAS = [
              "popularity.desc",  # Mais populares
              "vote_average.desc", # Mais bem avaliados
              "revenue.desc"       # Maior bilheteria
          ]

          vistos = set()

          print(f"🔍 Buscando o MÁXIMO de filmes no TMDB ({ANO_MIN}-{ANO_MAX})")
          print(f"📂 Categorias: {', '.join(CATEGORIAS)}")
          print(f"⏱️ Isso pode demorar alguns minutos...")

          for cat in CATEGORIAS:
              print(f"\n🌐 Categoria: {cat}")
              
              # Limite máximo do TMDB: 500 páginas (10.000 filmes por categoria)
              for pag in range(1, 501):
                  if pag % 50 == 0:
                      print(f"  → Página {pag}/500... (Total único: {len(vistos)})")

                  params = {
                      "api_key": KEY,
                      "language": LANG,
                      "sort_by": cat,
                      "include_adult": "false",
                      "include_video": "false",
                      "page": pag,
                      "vote_count.gte": 10, # Filtro baixo para pegar filmes de nicho também
                      "primary_release_date.gte": f"{ANO_MIN}-01-01",
                      "primary_release_date.lte": f"{ANO_MAX}-12-31",
                  }

                  try:
                      r = requests.get("https://api.themoviedb.org/3/discover/movie",
                                       params=params, timeout=30)
                      if r.status_code == 429: # Rate limit
                          print("  ⚠️ Rate limit atingido, aguardando 2s...")
                          time.sleep(2)
                          r = requests.get("https://api.themoviedb.org/3/discover/movie",
                                           params=params, timeout=30)
                      
                      if r.status_code != 200:
                          print(f"  ⚠️ Página {pag} retornou {r.status_code}. Fim da categoria.")
                          break
                  except Exception as e:
                      print(f"  ⚠️ Erro na página {pag}: {e}")
                      break

                  data = r.json()
                  resultados = data.get("results", [])
                  
                  if not resultados:
                      print(f"  ℹ️ Fim dos resultados na página {pag}.")
                      break

                  for m in resultados:
                      titulo = (m.get("title") or "").strip()
                      ano = (m.get("release_date") or "")[:4]
                      if not titulo:
                          continue
                      
                      # Formata como "Título (Ano)"
                      linha = f"{titulo} ({ano})" if ano else titulo
                      vistos.add(linha)

                  # Pausa para não estourar o rate limit da API
                  time.sleep(0.05)

          print(f"\n✅ Total de filmes únicos encontrados: {len(vistos)}")

          # Salva no filmes.txt (adicionando ao que já existe)
          existentes = set()
          if os.path.exists("filmes.txt"):
              with open("filmes.txt", "r", encoding="utf-8") as f:
                  for l in f:
                      l = l.strip()
                      if l and not l.startswith("#"):
                          existentes.add(l)

          novos = vistos - existentes

          with open("filmes.txt", "w", encoding="utf-8") as f:
              f.write(f"# Lista atualizada em {datetime.now().strftime('%Y-%m-%d %H:%M')}\n")
              f.write(f"# Total: {len(vistos)} filmes (novos hoje: {len(novos)})\n\n")
              for titulo in sorted(vistos):
                  f.write(titulo + "\n")

          print(f"💾 filmes.txt salvo com {len(vistos)} filmes ({len(novos)} novos adicionados hoje).")
          PYEOF

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          export GIT_EDITOR=true
          git config --global core.editor "true"
          
          git add filmes.txt
          if git diff --cached --quiet; then
            echo "Nenhuma alteração em filmes.txt (nenhum filme novo)."
            exit 0
          fi
          
          git commit -m "chore: filmes.txt atualizado via TMDB (Catálogo Máximo) [skip ci]"
          
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}"; then
              echo "✅ Push OK"
              exit 0
            fi
            sleep 5
          done
          exit 1
