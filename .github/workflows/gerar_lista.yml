name: Gerar filmes.txt via TMDB

on:
  workflow_dispatch:
    inputs:
      quantidade:
        description: 'Quantos filmes gerar (100-10000)'
        type: number
        default: 1000
        required: true
      ordenar_por:
        description: 'Ordenar por'
        type: choice
        options:
          - popularity
          - vote_average
          - revenue
        default: popularity
      ano_min:
        description: 'Ano mínimo'
        type: number
        default: 2000
        required: false
      ano_max:
        description: 'Ano máximo'
        type: number
        default: 2025
        required: false
      idioma:
        description: 'Idioma dos títulos (pt-BR, en-US, es-ES)'
        default: 'pt-BR'

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ⭐ CORREÇÃO: instalar dependência antes de rodar o script
      - name: Instalar dependências
        run: pip install requests

      - name: Gerar lista via TMDB
        env:
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
          QUANTIDADE: ${{ inputs.quantidade }}
          ORDENAR: ${{ inputs.ordenar_por }}
          ANO_MIN: ${{ inputs.ano_min }}
          ANO_MAX: ${{ inputs.ano_max }}
          LANG: ${{ inputs.idioma }}
        run: |
          python - <<'PYEOF'
          import os, time, requests

          KEY = os.environ["TMDB_KEY"]
          QTD = int(os.environ["QUANTIDADE"])
          ORD = os.environ.get("ORDENAR", "popularity")
          ANO_MIN = os.environ.get("ANO_MIN") or "2000"
          ANO_MAX = os.environ.get("ANO_MAX") or "2025"
          LANG = os.environ.get("LANG", "pt-BR")

          POR_PAGINA = 20
          PAGINAS = (QTD + POR_PAGINA - 1) // POR_PAGINA

          vistos = set()
          linhas = []

          linhas.append(f"# Gerado automaticamente via TMDB")
          linhas.append(f"# Ordenar por: {ORD} | Anos: {ANO_MIN}–{ANO_MAX} | Idioma: {LANG}")
          linhas.append("")

          for pag in range(1, PAGINAS + 1):
              if pag % 10 == 0:
                  print(f"  página {pag}/{PAGINAS} ({len(vistos)} títulos únicos)")

              params = {
                  "api_key": KEY,
                  "language": LANG,
                  "sort_by": f"{ORD}.desc",
                  "include_adult": "false",
                  "include_video": "false",
                  "page": pag,
                  "vote_count.gte": 100,
                  "primary_release_date.gte": f"{ANO_MIN}-01-01",
                  "primary_release_date.lte": f"{ANO_MAX}-12-31",
              }
              r = requests.get("https://api.themoviedb.org/3/discover/movie",
                               params=params, timeout=20)
              if r.status_code != 200:
                  print(f"  ⚠️ página {pag} falhou ({r.status_code}): {r.text[:120]}")
                  break

              for m in r.json().get("results", []):
                  titulo = (m.get("title") or "").strip()
                  ano = (m.get("release_date") or "")[:4]
                  if not titulo or titulo in vistos:
                      continue
                  vistos.add(titulo)
                  linhas.append(f"{titulo} ({ano})" if ano else titulo)
                  if len(vistos) >= QTD:
                      break

              if len(vistos) >= QTD:
                  break
              time.sleep(0.26)

          with open("filmes.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(linhas) + "\n")

          print(f"\n✅ {len(vistos)} filmes salvos em filmes.txt")
          PYEOF

      - name: Commit do filmes.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add filmes.txt

          if git diff --cached --quiet; then
            echo "filmes.txt não mudou."
            exit 0
          fi

          git commit -m "chore: gerar filmes.txt via TMDB (${{ inputs.quantidade }} filmes) [skip ci]"

          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}"; then
              echo "✅ Push OK"; exit 0
            fi
            sleep $((i*5))
          done
          exit 1
