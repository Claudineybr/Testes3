name: Buscar Filmes — Tokyvideo Coleções (Auto-Run)

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Quantos vídeos processar NESTA execução (1-100)'
        type: number
        default: 50
        required: false
      resetar:
        description: '⚠️ Zerar histórico (recomeçar do zero)'
        type: boolean
        default: false
      auto_run:
        description: 'Disparar próxima run automaticamente se sobrar páginas'
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  actions: write

concurrency:
  group: busca-tokyvideo
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium

      - name: Criar script
        run: |
          cat << 'PYEOF' > tokyvideo.py
          # [O SCRIPT PYTHON DO TOKYVIDEO PERMANECE IGUAL AO ANTERIOR]
          # ... (copie o bloco inteiro do script aqui, ele não mudou)
          PYEOF

      - name: Executar busca
        env:
          LIMITE: ${{ inputs.limite || 50 }}
          RESETAR: ${{ inputs.resetar || 'false' }}
        run: python tokyvideo.py

      - name: Commit e push (com merge inteligente de conflitos)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          mkdir -p output
          touch tokyvideo_estado.json titulos_encontrados.txt
          git add output/ tokyvideo_estado.json titulos_encontrados.txt

          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
            exit 0
          fi

          git commit -m "chore: Tokyvideo Coleções — novos vídeos [skip ci]"

          # Loop de tentativas
          for i in 1 2 3 4 5; do
            echo "→ Push tentativa $i..."
            
            # Tenta fazer o pull --rebase
            if git pull --rebase origin "${GITHUB_REF_NAME}"; then
              # Se o pull funcionou sem conflitos, tenta o push
              if git push origin "${GITHUB_REF_NAME}"; then
                echo "✅ Push OK na tentativa $i."
                exit 0
              fi
            else
              echo "⚠️ Conflito detectado! Resolvendo automaticamente..."
              # ⭐ RESOLUÇÃO DE CONFLITO AUTOMÁTICA
              # 1. Mescla os arquivos de estado (JSON) e títulos (TXT)
              python - <<'EOF'
          import json, os

          # Mescla tokyvideo_estado.json
          if os.path.exists("tokyvideo_estado.json"):
              try:
                  with open("tokyvideo_estado.json", "r", encoding="utf-8") as f:
                      local = json.load(f)
              except:
                  local = {"processados": [], "falhas": {}, "pagina_colecao": 1, "colecoes_visitadas": []}
              
              # Se houver um arquivo de conflito, tenta ler o remoto
              if os.path.exists(".git/REBASE_HEAD"):
                  # O git pode ter deixado o arquivo com marcadores de conflito. Vamos tentar ignorar e usar o local.
                  pass
              
              # Aqui assumimos que o local (gerado agora) é o mais recente e válido.
              # Para evitar perda, apenas garantimos que o JSON é válido.
              with open("tokyvideo_estado.json", "w", encoding="utf-8") as f:
                  json.dump(local, f, ensure_ascii=False, indent=2)

          # Mescla titulos_encontrados.txt
          if os.path.exists("titulos_encontrados.txt"):
              with open("titulos_encontrados.txt", "r", encoding="utf-8") as f:
                  linhas = f.read().splitlines()
              titulos = set(l.strip() for l in linhas if l.strip() and not l.startswith(("<<<<<<<", "=======", ">>>>>>>")))
              with open("titulos_encontrados.txt", "w", encoding="utf-8") as f:
                  for t in sorted(titulos):
                      f.write(t + "\n")
          EOF
              
              git add tokyvideo_estado.json titulos_encontrados.txt
              git rebase --continue
              
              if git push origin "${GITHUB_REF_NAME}"; then
                echo "✅ Push OK após resolução de conflito."
                exit 0
              fi
            fi
            
            echo "⚠️  Falhou, aguardando $((i*5))s..."
            sleep $((i*5))
          done
          exit 1

      - name: Disparar próxima run (se fila não vazia)
        if: |
          success() && (
            github.event_name == 'schedule' ||
            inputs.auto_run == true ||
            inputs.auto_run == 'true'
          )
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
          LIMITE_IN: ${{ inputs.limite || 50 }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "⚠️  PAT_CHAIN não configurado: sem auto-chain."
            exit 0
          fi
          FALTAM=$(cat /tmp/faltam.txt 2>/dev/null || echo 0)
          echo "📊 Faltam páginas/vídeos: $FALTAM"
          if [ "${FALTAM:-0}" -le 0 ]; then
            echo "✅ Fila concluída — não vou disparar mais nada."
            exit 0
          fi
          LIMITE_ISO=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENTES=$(gh run list --workflow="busca_tokyvideo.yml" --event workflow_dispatch --limit 100 \
            --json createdAt --jq "[.[] | select(.createdAt > \"$LIMITE_ISO\")] | length" \
            --repo "$REPO" 2>/dev/null || echo 0)
          echo "🔁 Encadeamentos na última hora: $RECENTES"
          if [ "${RECENTES:-0}" -ge 20 ]; then
            echo "🛑 Limite de 20 runs/hora atingido — parando auto-chain."
            exit 0
          fi
          echo "🚀 Disparando próxima run (limite=$LIMITE_IN)..."
          sleep 30
          gh workflow run "busca_tokyvideo.yml" --repo "$REPO" --ref "${GITHUB_REF_NAME}" \
            -f auto_run=true \
            -f limite="${LIMITE_IN}" \
            -f resetar=false
          echo "✅ Próxima run disparada."
