name: Buscar Filmes — Tokyvideo Categorias (Playwright)

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Quantos filmes processar NESTA execução (1-100)'
        type: number
        default: 50
        required: false
  schedule:
    - cron: '0 6 * * 1'   # toda segunda às 6h UTC

permissions:
  contents: write
  actions: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium

      - name: Criar script
        run: |
          cat << 'PYEOF' > tokyvideo.py
          import os, re, json, time, sys, unicodedata
          from datetime import datetime
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup
          from html import escape as html_escape

          try:
              sys.stdout.reconfigure(line_buffering=True)
          except Exception:
              pass

          _orig_print = print
          def print(*args, **kwargs):
              kwargs.setdefault("flush", True)
              ts = datetime.now().strftime("%H:%M:%S")
              _orig_print(f"[{ts}]", *args, **kwargs)

          LIMITE = int(os.environ.get("LIMITE", "50"))
          MIN_DURACAO = 40 * 60
          ARQ_ESTADO = "tokyvideo_estado.json"
          ARQ_TITULOS = "titulos_encontrados.txt"

          CATALOGOS = [
              "https://www.tokyvideo.com/br/séries/filmes-diversos",
              "https://www.tokyvideo.com/br/séries/netcine-filmes-e-series-online-gratis",
              "https://www.tokyvideo.com/br/séries/englobe-filmes-online-gratis",
              "https://www.tokyvideo.com/br/séries/filmes-de-animacao",
              "https://www.tokyvideo.com/br/séries/filmes-classicos",
          ]

          def normalizar(t):
              t = unicodedata.normalize("NFKD", t).encode("ascii","ignore").decode("ascii")
              return t.lower()

          def slugify(t):
              t = unicodedata.normalize("NFKD", t).encode("ascii","ignore").decode("ascii")
              t = re.sub(r"[^\w\s-]", "", t).strip().lower()
              return re.sub(r"[-\s]+", "-", t)[:80] or "video"

          # ⭐ PARSER DE DURAÇÃO MAIS ROBUSTO
          def parse_duracao(texto):
              if not texto: return 0
              texto = str(texto)
              # Formato ISO 8601 (PT1H32M)
              m = re.search(r'PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?', texto)
              if m and (m.group(1) or m.group(2) or m.group(3)):
                  return int(m.group(1) or 0)*3600 + int(m.group(2) or 0)*60 + int(m.group(3) or 0)
              # Formato 1h 32m ou 1h32m
              m = re.search(r'(\d+)h\s*(\d+)m', texto)
              if m: return int(m.group(1))*3600 + int(m.group(2))*60
              m = re.search(r'(\d+)h', texto)
              if m and 'min' not in texto: return int(m.group(1))*3600
              # Formato 01:32:45
              m = re.search(r'(\d+):(\d+):(\d+)', texto)
              if m: return int(m.group(1))*3600 + int(m.group(2))*60 + int(m.group(3))
              # Formato 92:45
              m = re.search(r'(\d+):(\d+)', texto)
              if m: return int(m.group(1))*60 + int(m.group(2))
              # Formato 92 min
              m = re.search(r'(\d+)\s*min', texto)
              if m: return int(m.group(1))*60
              return 0

          # ⭐ EXTRAI DURAÇÃO DE 6 LUGARES DIFERENTES
          def obter_duracao(html, soup):
              # 1. JSON-LD
              for script in soup.find_all("script", type="application/ld+json"):
                  try:
                      data = json.loads(script.string)
                      if isinstance(data, dict) and "duration" in data:
                          d = parse_duracao(data["duration"])
                          if d > 0: return d
                      if isinstance(data, list):
                          for item in data:
                              if isinstance(item, dict) and "duration" in item:
                                  d = parse_duracao(item["duration"])
                                  if d > 0: return d
                  except: pass
              
              # 2. Meta tags
              for m in soup.find_all("meta"):
                  if m.get("itemprop") == "duration" or m.get("property") == "og:video:duration":
                      d = parse_duracao(m.get("content"))
                      if d > 0: return d
              
              # 3. Regex no HTML bruto
              m = re.search(r'"duration"\s*:\s*"?(PT[\dHMS]+)"?', html)
              if m:
                  d = parse_duracao(m.group(1))
                  if d > 0: return d
              
              # 4. Classes CSS comuns
              for sel in ["span.duration", "div.duration", ".video-duration", ".time-duration", "[itemprop='duration']", ".entry-duration"]:
                  el = soup.select_one(sel)
                  if el:
                      d = parse_duracao(el.get_text(strip=True))
                      if d > 0: return d
              
              # 5. Procura HH:MM:SS ou MM:SS no texto puro da página
              texto_pagina = soup.get_text(" ", strip=True)
              m = re.search(r'\b(\d{1,2}:\d{2}:\d{2})\b', texto_pagina)
              if m:
                  d = parse_duracao(m.group(1))
                  if d > 60: return d # ignora coisas como 1:30
                  
              return 0

          def gerar_html(titulo, thumb, link, outdir):
              os.makedirs(outdir, exist_ok=True)
              filename = os.path.join(outdir, slugify(titulo) + ".html")
              json_ld = {
                  "@context": "https://schema.org", "@type": "VideoObject",
                  "supportPlatform": ["https://schema.org/IOSPlatform","https://schema.org/AndroidPlatform"],
                  "name": titulo, "description": "Assista " + titulo,
                  "thumbnailUrl": [thumb] if thumb else [], "contentUrl": link,
              }
              tpl = """<!DOCTYPE html>
          <html lang="pt-BR"><head><meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <script type="application/ld+json">{jl}</script>
          <title>{t}</title>
          <style>body{{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:20px}}h1{{font-size:24px;text-align:center;margin-bottom:30px}}</style>
          </head><body>
          <h1>{t}</h1>
          <div style="background:#0b0b12;border-radius:20px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.8);margin:25px 0;border:1px solid rgba(255,255,255,.06);">
            <a href="{l}" target="_blank" style="display:block;position:relative;text-decoration:none;">
              <img src="{th}" style="width:100%;display:block;">
              <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.7),transparent);"></div>
              <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;background:linear-gradient(135deg,#7a00ff,#c000ff);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(120,0,255,.6);color:white;font-size:26px;border:2px solid rgba(255,255,255,.2);">▶</div>
              <div style="position:absolute;top:12px;right:12px;background:#ff003c;padding:6px 12px;border-radius:20px;font-size:11px;color:#fff;font-weight:bold;">HD</div>
            </a>
          </div></body></html>"""
              with open(filename, "w", encoding="utf-8") as f:
                  f.write(tpl.format(jl=json.dumps(json_ld, ensure_ascii=False, indent=2),
                                     t=html_escape(titulo), l=html_escape(link), th=html_escape(thumb)))

          def carregar_estado():
              if os.path.exists(ARQ_ESTADO):
                  try:
                      with open(ARQ_ESTADO, "r", encoding="utf-8") as f:
                          return json.load(f)
                  except Exception: pass
              return {"processados": []}

          def salvar_estado(estado):
              with open(ARQ_ESTADO, "w", encoding="utf-8") as f:
                  json.dump(estado, f, ensure_ascii=False, indent=2)

          def main():
              estado = carregar_estado()
              processados = set(estado.get("processados", []))
              encontrados = set()

              print(f"🎬 Tokyvideo — limite: {LIMITE} filmes por run")
              print(f"📂 Já processados anteriormente: {len(processados)}")

              links_coletados = set()

              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page()

                  for url_cat in CATALOGOS:
                      print(f"\n🌐 Abrindo catálogo: {url_cat.split('/')[-1]}")
                      try:
                          page.goto(url_cat, timeout=60000)
                          page.wait_for_timeout(3000)
                          for _ in range(10):
                              page.mouse.wheel(0, 5000)
                              page.wait_for_timeout(1000)

                          html = page.content()
                          soup = BeautifulSoup(html, "html.parser")
                          cat_links = 0
                          for a in soup.find_all("a", href=True):
                              href = a["href"]
                              if "/br/video/" in href:
                                  link_abs = href if href.startswith("http") else "https://www.tokyvideo.com" + href
                                  if link_abs not in links_coletados and link_abs not in processados:
                                      links_coletados.add(link_abs)
                                      cat_links += 1
                          print(f"  → {cat_links} novos links encontrados nesta categoria")
                      except Exception as e:
                          print(f"  ⚠️  Erro ao acessar categoria: {e}")

                  print(f"\n🔗 Total de links novos para processar: {len(links_coletados)}")

                  novos_html = 0
                  links_para_processar = list(links_coletados)[:LIMITE * 3] 

                  for i, href in enumerate(links_para_processar, 1):
                      if novos_html >= LIMITE:
                          break

                      try:
                          page.goto(href, timeout=30000)
                          # Espera um pouco mais para o JS carregar o player
                          page.wait_for_timeout(4000) 

                          conteudo = page.content()
                          soup_v = BeautifulSoup(conteudo, "html.parser")

                          # ⭐ Limpar Título
                          titulo = ""
                          og_title = soup_v.find("meta", property="og:title")
                          if og_title: titulo = og_title.get("content", "").strip()
                          if not titulo:
                              h1 = soup_v.find("h1")
                              if h1: titulo = h1.get_text(strip=True)
                          if not titulo:
                              titulo = page.title().replace(" - Tokyvideo", "").strip()
                              
                          # Remove prefixos/sufixos chatos
                          titulo = re.sub(r"^Assistir\s+['\"]?|['\"]?\s+Filme.*$", "", titulo, flags=re.IGNORECASE).strip()
                          titulo = re.sub(r"\s*\|.*$", "", titulo).strip()

                          # ⭐ Nova extração de duração
                          dur_seg = obter_duracao(conteudo, soup_v)
                          
                          if dur_seg < MIN_DURACAO:
                              # Se for 0, tenta salvar o HTML num arquivo de debug para o usuário olhar
                              if dur_seg == 0:
                                  os.makedirs("debug", exist_ok=True)
                                  with open(f"debug/{slugify(titulo)}.html", "w", encoding="utf-8") as f:
                                      f.write(conteudo)
                                      
                              print(f"  [{i}/{len(links_para_processar)}] ⏭️  {titulo[:40]}... (~{dur_seg//60}min) - <40min")
                              processados.add(href)
                              continue

                          thumb = ""
                          og = soup_v.find("meta", property="og:image")
                          if og: thumb = og.get("content", "")

                          gerar_html(titulo, thumb, href, "output")
                          encontrados.add(titulo)
                          processados.add(href)
                          novos_html += 1
                          print(f"  [{i}/{len(links_para_processar)}] ✅ {titulo[:50]} ({dur_seg//60}min)")

                      except Exception as e:
                          print(f"  [{i}/{len(links_para_processar)}] ⚠️  erro: {e}")
                          continue

                  browser.close()

              estado["processados"] = list(processados)
              salvar_estado(estado)

              titulos_antigos = set()
              if os.path.exists(ARQ_TITULOS):
                  with open(ARQ_TITULOS, "r", encoding="utf-8") as f:
                      titulos_antigos = {l.strip() for l in f if l.strip()}
              titulos_antigos.update(encontrados)
              with open(ARQ_TITULOS, "w", encoding="utf-8") as f:
                  for t in sorted(titulos_antigos):
                      f.write(t + "\n")

              print(f"\n══════════ RESUMO ══════════")
              print(f"Novos HTMLs gerados: {novos_html}")
              print(f"Total de links processados (histórico): {len(processados)}")
              print("════════════════════════════")

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Executar busca
        env:
          LIMITE: ${{ inputs.limite || 50 }}
        run: python tokyvideo.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          mkdir -p output
          touch tokyvideo_estado.json titulos_encontrados.txt
          git add output/ tokyvideo_estado.json titulos_encontrados.txt
          # Adiciona a pasta debug caso tenha sido criada
          if [ -d "debug" ]; then
            git add debug/
          fi
          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
            exit 0
          fi
          git commit -m "chore: Tokyvideo Categorias — novos filmes [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}"; then
              echo "✅ Push OK"
              exit 0
            fi
            sleep $((i*5))
          done
          exit 1
