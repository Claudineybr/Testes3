name: Buscar Filmes — Tokyvideo Coleções (Playwright)

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Quantos filmes processar NESTA execução (1-100)'
        type: number
        default: 50
        required: false
      resetar:
        description: '⚠️ Zerar histórico'
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  actions: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium

      - name: Criar script
        run: |
          cat << 'PYEOF' > tokyvideo.py
          import os, re, json, time, sys, unicodedata
          from datetime import datetime
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup
          from html import escape as html_escape
          from urllib.parse import unquote

          try:
              sys.stdout.reconfigure(line_buffering=True)
          except Exception:
              pass

          _orig_print = print
          def print(*args, **kwargs):
              kwargs.setdefault("flush", True)
              ts = datetime.now().strftime("%H:%M:%S")
              _orig_print(f"[{ts}]", *args, **kwargs)

          LIMITE = int(os.environ.get("LIMITE", "50"))
          RESETAR = os.environ.get("RESETAR", "").lower() == "true"
          MIN_DURACAO = 40 * 60
          ARQ_ESTADO = "tokyvideo_estado.json"
          ARQ_TITULOS = "titulos_encontrados.txt"

          # ⭐ URL base correta (com acento)
          URL_SERIES_BASE = "https://www.tokyvideo.com/br/séries"

          def slugify(t):
              t = unicodedata.normalize("NFKD", t).encode("ascii","ignore").decode("ascii")
              t = re.sub(r"[^\w\s-]", "", t).strip().lower()
              return re.sub(r"[-\s]+", "-", t)[:80] or "video"

          def parse_duracao(texto):
              if not texto: return 0
              texto = str(texto).strip()
              m = re.search(r'PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?', texto)
              if m and (m.group(1) or m.group(2) or m.group(3)):
                  return int(m.group(1) or 0)*3600 + int(m.group(2) or 0)*60 + int(m.group(3) or 0)
              if re.match(r'^\d+$', texto):
                  v = int(texto)
                  if 60 <= v <= 30000: return v
              m = re.search(r'(\d+)\s*h\s*(\d+)\s*m', texto)
              if m: return int(m.group(1))*3600 + int(m.group(2))*60
              m = re.search(r'(\d+)\s*min', texto)
              if m: return int(m.group(1))*60
              m = re.search(r'(\d{1,2}):(\d{2}):(\d{2})', texto)
              if m: return int(m.group(1))*3600 + int(m.group(2))*60 + int(m.group(3))
              m = re.search(r'^(\d{1,3}):(\d{2})$', texto)
              if m: return int(m.group(1))*60 + int(m.group(2))
              m = re.search(r'^(\d+)\s*h$', texto)
              if m: return int(m.group(1))*3600
              return 0

          def extrair_duracao_de_json(obj, prof=0):
              if prof > 10: return 0
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      kl = str(k).lower()
                      if kl in ("duration", "length", "video_duration", "videoduration", "tempo"):
                          if isinstance(v, (int, float)):
                              if 60 <= v <= 30000: return int(v)
                          elif isinstance(v, str):
                              d = parse_duracao(v)
                              if d > 0: return d
                      r = extrair_duracao_de_json(v, prof+1)
                      if r > 0: return r
              elif isinstance(obj, list):
                  for item in obj[:20]:
                      r = extrair_duracao_de_json(item, prof+1)
                      if r > 0: return r
              return 0

          def obter_duracao_html(html, soup):
              for script in soup.find_all("script", type="application/ld+json"):
                  try:
                      data = json.loads(script.string)
                      d = extrair_duracao_de_json(data)
                      if d > 0: return d
                  except: pass
              for m in soup.find_all("meta"):
                  if m.get("itemprop") == "duration" or m.get("property") == "og:video:duration":
                      d = parse_duracao(m.get("content"))
                      if d > 0: return d
              matches = re.findall(r'duration["\']?\s*[:=]\s*["\']?(\d+)', html, re.IGNORECASE)
              for m in matches:
                  d = int(m)
                  if 60 <= d <= 30000: return d
              for sel in ["span.duration", "div.duration", ".video-duration", ".time-duration", "[itemprop='duration']"]:
                  el = soup.select_one(sel)
                  if el:
                      d = parse_duracao(el.get_text(strip=True))
                      if d > 0: return d
              texto_pagina = soup.get_text(" ", strip=True)
              m = re.search(r'\b(\d{1,2}:\d{2}:\d{2})\b', texto_pagina)
              if m:
                  d = parse_duracao(m.group(1))
                  if d > 60: return d
              return 0

          def gerar_html(titulo, thumb, link, outdir):
              os.makedirs(outdir, exist_ok=True)
              filename = os.path.join(outdir, slugify(titulo) + ".html")
              json_ld = {
                  "@context": "https://schema.org", "@type": "VideoObject",
                  "supportPlatform": ["https://schema.org/IOSPlatform","https://schema.org/AndroidPlatform"],
                  "name": titulo, "description": "Assista " + titulo,
                  "thumbnailUrl": [thumb] if thumb else [], "contentUrl": link,
              }
              tpl = """<!DOCTYPE html>
          <html lang="pt-BR"><head><meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <script type="application/ld+json">{jl}</script>
          <title>{t}</title>
          <style>body{{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:20px}}h1{{font-size:24px;text-align:center;margin-bottom:30px}}</style>
          </head><body>
          <h1>{t}</h1>
          <div style="background:#0b0b12;border-radius:20px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.8);margin:25px 0;border:1px solid rgba(255,255,255,.06);">
            <a href="{l}" target="_blank" style="display:block;position:relative;text-decoration:none;">
              <img src="{th}" style="width:100%;display:block;">
              <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.7),transparent);"></div>
              <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;background:linear-gradient(135deg,#7a00ff,#c000ff);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(120,0,255,.6);color:white;font-size:26px;border:2px solid rgba(255,255,255,.2);">▶</div>
              <div style="position:absolute;top:12px;right:12px;background:#ff003c;padding:6px 12px;border-radius:20px;font-size:11px;color:#fff;font-weight:bold;">HD</div>
            </a>
          </div></body></html>"""
              with open(filename, "w", encoding="utf-8") as f:
                  f.write(tpl.format(jl=json.dumps(json_ld, ensure_ascii=False, indent=2),
                                     t=html_escape(titulo), l=html_escape(link), th=html_escape(thumb)))

          def carregar_estado():
              if os.path.exists(ARQ_ESTADO):
                  try:
                      with open(ARQ_ESTADO, "r", encoding="utf-8") as f:
                          return json.load(f)
                  except Exception: pass
              return {"processados": [], "falhas": {}, "pagina_colecao": 1, "colecoes_visitadas": []}

          def salvar_estado(estado):
              with open(ARQ_ESTADO, "w", encoding="utf-8") as f:
                  json.dump(estado, f, ensure_ascii=False, indent=2)

          # ⭐ NOVO: extrai links de coleções com filtro robusto (acento + paginação)
          def extrair_colecoes(html, soup):
              colecoes = set()
              
              # 1. Pelo BeautifulSoup (href direto)
              for a in soup.find_all("a", href=True):
                  h = a["href"]
                  # Aceita séries, series, séries (com/sem acento)
                  if re.search(r'/br/s[ée]ries/[a-z0-9\-]+$', h, re.IGNORECASE):
                      # Ignora se for só paginação (/br/séries/2)
                      if re.search(r'/br/s[ée]ries/\d+$', h, re.IGNORECASE):
                          continue
                      lk = h if h.startswith("http") else "https://www.tokyvideo.com" + h
                      colecoes.add(unquote(lk))
              
              # 2. Fallback: regex no HTML bruto (pega links que o BS não viu)
              raw_links = re.findall(r'href="(/br/s[ée]ries/[a-z0-9\-]+)"', html, re.IGNORECASE)
              for h in raw_links:
                  if re.search(r'/br/s[ée]ries/\d+$', h, re.IGNORECASE):
                      continue
                  lk = "https://www.tokyvideo.com" + h
                  colecoes.add(unquote(lk))
              
              return colecoes

          def main():
              estado = carregar_estado()
              if RESETAR:
                  print("🔄 RESETANDO histórico...")
                  estado = {"processados": [], "falhas": {}, "pagina_colecao": 1, "colecoes_visitadas": []}

              processados = set(estado.get("processados", []))
              falhas = estado.get("falhas", {})
              colecoes_visitadas = set(estado.get("colecoes_visitadas", []))
              pagina_colecao = estado.get("pagina_colecao", 1)
              encontrados = set()
              videos_gerados = 0

              print(f"🎬 Tokyvideo — Meta: {LIMITE} filmes | Página atual: {pagina_colecao}")
              print(f"📂 Histórico: {len(processados)} filmes | {len(colecoes_visitadas)} coleções visitadas")

              links_videos_para_processar = set()

              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  context = browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                  )
                  page = context.new_page()

                  # --- VARREDURA DE COLEÇÕES ---
                  while videos_gerados < LIMITE and pagina_colecao <= 37:
                      if pagina_colecao == 1:
                          url_pagina = URL_SERIES_BASE
                      else:
                          url_pagina = f"{URL_SERIES_BASE}/{pagina_colecao}"

                      print(f"\n👥 Varrendo Página {pagina_colecao}/37")
                      print(f"  URL: {url_pagina}")

                      try:
                          page.goto(url_pagina, timeout=60000)
                          page.wait_for_timeout(4000)
                          
                          # Rola várias vezes para carregar lazy loading completo
                          for _ in range(8):
                              page.mouse.wheel(0, 6000)
                              page.wait_for_timeout(800)

                          html = page.content()
                          soup_p = BeautifulSoup(html, "html.parser")
                          
                          colecoes = extrair_colecoes(html, soup_p)
                          colecoes_novas = colecoes - colecoes_visitadas
                          
                          print(f"  → {len(colecoes)} coleções encontradas, {len(colecoes_novas)} são novas")
                          
                          if not colecoes_novas:
                              print("  ℹ️  Nenhuma coleção nova nesta página")
                              # Mostra amostra das encontradas (debug)
                              if colecoes:
                                  amostra = list(colecoes)[:3]
                                  print(f"     Amostra: {[c.split('/')[-1][:30] for c in amostra]}")
                              pagina_colecao += 1
                              continue

                          # Mostra as primeiras 5 para o log
                          for c in list(colecoes_novas)[:5]:
                              print(f"     • {c.split('/')[-1][:50]}")

                          for colecao in colecoes_novas:
                              if videos_gerados >= LIMITE: break
                              if colecao in colecoes_visitadas: continue

                              try:
                                  print(f"    🔍 Entrando: {colecao.split('/')[-1][:40]}")
                                  page.goto(colecao, timeout=30000)
                                  page.wait_for_timeout(2000)
                                  
                                  # Rola para carregar vídeos da coleção
                                  for _ in range(3):
                                      page.mouse.wheel(0, 4000)
                                      page.wait_for_timeout(800)
                                  
                                  soup_colecao = BeautifulSoup(page.content(), "html.parser")

                                  cat_links = 0
                                  for a_v in soup_colecao.find_all("a", href=True):
                                      if "/br/video/" in a_v["href"]:
                                          lk_v = a_v["href"] if a_v["href"].startswith("http") else "https://www.tokyvideo.com" + a_v["href"]
                                          if lk_v not in processados and falhas.get(lk_v, 0) < 3:
                                              links_videos_para_processar.add(lk_v)
                                              cat_links += 1
                                  
                                  colecoes_visitadas.add(colecao)
                                  print(f"      ✓ {cat_links} vídeos novos")

                              except Exception as e:
                                  print(f"    ⚠️ Erro: {str(e)[:40]}")
                                  colecoes_visitadas.add(colecao)

                              if len(links_videos_para_processar) > 40:
                                  break

                      except Exception as e:
                          print(f"  ⚠️ Erro na página {pagina_colecao}: {str(e)[:60]}")

                      pagina_colecao += 1
                      if len(links_videos_para_processar) > 40:
                          break

                  print(f"\n🎞️  Links de vídeos coletados: {len(links_videos_para_processar)}")

                  # --- PROCESSAR VÍDEOS ---
                  for i, href in enumerate(list(links_videos_para_processar)):
                      if videos_gerados >= LIMITE: break

                      page_v = context.new_page()
                      duracao_rede = {"valor": 0}

                      def handler(resp):
                          try:
                              ct = resp.headers.get("content-type", "")
                              if "json" in ct or "javascript" in ct:
                                  if resp.status == 200:
                                      txt = resp.text()
                                      if len(txt) > 500000: return
                                      if "duration" in txt.lower():
                                          try:
                                              data = json.loads(txt)
                                              d = extrair_duracao_de_json(data)
                                              if d > duracao_rede["valor"]: duracao_rede["valor"] = d
                                          except:
                                              m = re.search(r'"duration"\s*:\s*"?(\d+|PT[\dHMS]+)"?', txt)
                                              if m:
                                                  d = parse_duracao(m.group(1))
                                                  if d > duracao_rede["valor"]: duracao_rede["valor"] = d
                          except: pass

                      page_v.on("response", handler)

                      try:
                          page_v.goto(href, timeout=30000, wait_until="domcontentloaded")
                          try: page_v.wait_for_load_state("networkidle", timeout=10000)
                          except: pass
                          page_v.wait_for_timeout(1000)

                          conteudo = page_v.content()
                          soup_v = BeautifulSoup(conteudo, "html.parser")

                          titulo = ""
                          og_title = soup_v.find("meta", property="og:title")
                          if og_title: titulo = og_title.get("content", "").strip()
                          if not titulo:
                              h1 = soup_v.find("h1")
                              if h1: titulo = h1.get_text(strip=True)
                          if not titulo: titulo = page_v.title().replace(" - Tokyvideo", "").strip()

                          titulo = re.sub(r"^Assistir\s+['\"]?|['\"]?\s+Filme.*$", "", titulo, flags=re.IGNORECASE).strip()
                          titulo = re.sub(r"\s*\|.*$", "", titulo).strip()

                          dur = duracao_rede["valor"] if duracao_rede["valor"] > 0 else obter_duracao_html(conteudo, soup_v)

                          if dur < MIN_DURACAO:
                              if dur == 0:
                                  falhas[href] = falhas.get(href, 0) + 1
                                  print(f"  ❓ {titulo[:40]}... (0min - {falhas[href]}/3)")
                              else:
                                  processados.add(href)
                              page_v.close()
                              continue

                          thumb = ""
                          og = soup_v.find("meta", property="og:image")
                          if og: thumb = og.get("content", "")

                          gerar_html(titulo, thumb, href, "output")
                          encontrados.add(titulo)
                          processados.add(href)
                          if href in falhas: del falhas[href]
                          videos_gerados += 1
                          print(f"  ✅ {titulo[:50]} ({dur//60}min)")

                      except Exception as e:
                          falhas[href] = falhas.get(href, 0) + 1
                          print(f"  ⚠️ erro: {str(e)[:30]} ({falhas[href]}/3)")
                      finally:
                          page_v.close()

                  context.close()
                  browser.close()

              # Salva estado
              estado["processados"] = list(processados)
              estado["falhas"] = falhas
              estado["colecoes_visitadas"] = list(colecoes_visitadas)
              estado["pagina_colecao"] = pagina_colecao
              salvar_estado(estado)

              titulos_antigos = set()
              if os.path.exists(ARQ_TITULOS):
                  with open(ARQ_TITULOS, "r", encoding="utf-8") as f:
                      titulos_antigos = {l.strip() for l in f if l.strip()}
              titulos_antigos.update(encontrados)
              with open(ARQ_TITULOS, "w", encoding="utf-8") as f:
                  for t in sorted(titulos_antigos):
                      f.write(t + "\n")

              print(f"\n══════════ RESUMO ══════════")
              print(f"Novos HTMLs: {videos_gerados}")
              print(f"Coleções visitadas: {len(colecoes_visitadas)} | Próxima página: {pagina_colecao}")
              print("════════════════════════════")

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Executar busca
        env:
          LIMITE: ${{ inputs.limite || 50 }}
          RESETAR: ${{ inputs.resetar || 'false' }}
        run: python tokyvideo.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          mkdir -p output
          touch tokyvideo_estado.json titulos_encontrados.txt
          git add output/ tokyvideo_estado.json titulos_encontrados.txt
          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
            exit 0
          fi
          git commit -m "chore: Tokyvideo Coleções — novos filmes [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}"; then
              echo "✅ Push OK"
              exit 0
            fi
            sleep $((i*5))
          done
          exit 1
